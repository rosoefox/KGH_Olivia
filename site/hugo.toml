baseURL = 'https://rosoefox.github.io/KGH_Olivia/'
defaultContentLanguage = 'ko'
defaultContentLanguageInSubdir = false


[outputs]
  home = ['HTML', 'RSS', 'JSON']

[pagination]
  pagerSize = 10

[taxonomies]
  tag = 'tags'
  series = 'series'

[params]
  # === Content Limits ===
  homepagePostsLimit = 10
  cardSummaryLength = 150
  relatedPostsLimit = 3
  cardImageQuality = 80
  coverImageQuality = 85
  # contentImageQuality = 90

  # === Banner Text ===
  # 배너 문구를 비워 두기 위해 공백 한 칸을 지정 (빈 문자열이면 테마 기본 문구가 표시됨)
  bannerTitle = ' '
  # bannerHighlight = ''
  bannerSubtitle = ' '

  # === Feature Toggles (default: true, set false to disable) ===
  enableLoadingAnimation = true
  enableMouseGlow = true
  showBanner = true
  showReadingProgress = true
  enableLightbox = true
  showScrollTop = true
  enableSearch = true
  showRelatedPosts = true
  showSeriesNav = true
  enableCodeCopy = true
  enableScrollAnimation = true

  # === Share ===
  share = false
  sharePlatforms = ['twitter', 'facebook', 'linkedin']

  # === Advanced: Custom CSS/JS ===
  # customCSS = ['css/custom.css']
  # customJS = ['js/custom.js']
  # 한글 글리프가 있는 Noto Sans KR 추가, 테마 기본 일본어 폰트(Zen Maru Gothic)는 제외
  googleFontsURL = 'https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap'

  # === Style Overrides ===
  [params.style]
    colorAccent = '#4a7de0'
    colorAccentWarm = '#e8609e'
    colorAccentSoft = '#a78bfa'
    fontDisplay = "'Outfit', 'Noto Sans KR', sans-serif"
    fontBody = "'Noto Sans KR', sans-serif"
    fontMono = "'JetBrains Mono', monospace"
    bannerImageText = '#fff'
    # bannerImageSubtitle = 'rgba(255, 255, 255, 0.8)'
    bannerImageGradient = 'linear-gradient(135deg, #4a7de0, #e8609e)'
    bannerImageGradientFill = 'transparent'

  [params.sidebar]
    showAllPosts = true
    showCategories = true
    showTags = true
    showRecent = true
    categoryLimit = 5
    tagsLimit = 20
    recentLimit = 5
    # tagWarmThreshold = 3

[markup]
  [markup.highlight]
    guessSyntax = true
    noClasses = false
    lineNos = false
    lineNumbersInTable = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['$$', '$$']]
      inline = [['$', '$']]

# ============================================
# Languages
# ============================================

[languages]
  [languages.ko]
    languageCode = 'ko'
    languageName = '한국어'
    weight = 1
    title = "가현's Portfolio"

    [languages.ko.params]
      description = '축산 AI 개발자 김가현 포트폴리오'
      author = '김가현 / Olivia'
      tagline = '// 축산 AI 개발자'
      bio = '동물생명공학과 · 컴퓨터공학과'
      #banner = '/images/demo02.jpg'
      #avatar = '/images/avatar.webp'

      [[languages.ko.params.social]]
        name = "GitHub"
        url = "https://github.com/rosoefox"

    # -- Navigation Menu --
    [[languages.ko.menus.main]]
      name = "홈"
      pageRef = "/"
      weight = 1
      pre = "⌂"
    [[languages.ko.menus.main]]
      name = "글"
      pageRef = "/posts"
      weight = 2
      pre = "✎"
    [[languages.ko.menus.main]]
      name = "소개"
      pageRef = "/about"
      weight = 5
      pre = "◉"

[related]
  includeNewer = true
  threshold = 50
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 80
  [[related.indices]]
    name = "date"
    weight = 10
    pattern = "2006"

[caches]
  [caches.images]
    dir = ':cacheDir/images'
